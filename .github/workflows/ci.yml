name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # package.json richiede Node >=22 <23 con engine-strict: con la 20 ogni
  # `npm ci` moriva su EBADENGINE e la CI falliva prima ancora di partire.
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Check
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test -- --run --reporter=verbose

      - name: Run Tests with Coverage
        run: npm run test:coverage
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'placeholder-secret-for-ci-build'
          AUTH_SECRET: 'placeholder-secret-for-ci-build'

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocca davvero: una vulnerabilità critica in ciò che gira in
      # produzione non deve poter essere mergiata. Oggi ne abbiamo zero,
      # quindi il gate è sostenibile. Le dipendenze di sviluppo sono escluse:
      # non girano sul server, e le loro falle non sono lo stesso rischio.
      - name: Vulnerabilità critiche in produzione (blocca)
        run: npm audit --omit=dev --audit-level=critical

      # Informativo: resta visibile nel log senza fermare la pipeline. Oggi
      # segnala minimatch (plugin di build Sentry) ed exceljs/uuid, il cui
      # unico rimedio offerto sarebbe un downgrade peggiore del problema.
      - name: Vulnerabilità alte e moderate (solo segnalazione)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true
