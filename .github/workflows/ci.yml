name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # package.json richiede Node >=22 <23 con engine-strict: con la 20 ogni
  # `npm ci` moriva su EBADENGINE e la CI falliva prima ancora di partire.
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      # tsconfig.strict.json non passa ancora: il cricchetto impedisce che il
      # numero di errori salga. La baseline vive in scripts/strict-ratchet.mjs.
      - name: Strict mode ratchet
        run: npm run strict:ratchet

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Un'unica esecuzione: test:coverage:ci gira gli stessi test e in più
      # applica le soglie di copertura, che sono bloccanti.
      - name: Run Tests with Coverage
        run: npm run test:coverage:ci -- --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          NEXTAUTH_URL: 'http://localhost:3000'
          NEXTAUTH_SECRET: 'placeholder-secret-for-ci-build'
          AUTH_SECRET: 'placeholder-secret-for-ci-build'

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # L'albero ha già vulnerabilità note che non si risolvono con un
      # aggiornamento indolore: il cricchetto blocca quelle nuove invece di
      # lasciar passare tutto come faceva continue-on-error.
      - name: Audit ratchet
        run: npm run audit:ratchet
